[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
local_scheme="no-local-version"
version_file = "pyprocar/_version.py"
version_scheme="python-simplified-semver"


[project]
name = "PyProcar"
authors = [
    {name = "Francisco Muñoz", email = "fvmunoz@gmail.com"},
    {name = "Logan Lang", email = "lllang@mix.wvu.edu"},
    {name = "Aldo Romero", email = "alromero@mail.wvu.edu"},
    {name = "Sobhit Singh", email = "smsingh@mix.wvu.edu"},
    {name = "Uthpala Herath", email = "ukh0001@mix.wvu.edu"},
    {name = "Pedram Tavadze", email = "petavazohi@mix.wvu.edu"},
    {name = "Eric Bousquet", email = "eric.bousquet@uliege.be"},
    {name = "Xu He", email = "mailhexu@gmail.com"},
    {name = "Reese Boucher"},
    {name = "Freddy Farah"}
]

description = "A Python library for electronic structure pre/post-processing."
readme = {file = "README.md", content-type = "text/markdown"}  # Ensure this matches the file used
license = "MIT"
license-files = ["LICENSE"]
keywords = ["materials", "science", "plotting", "electronic structure", "DFT"]
classifiers = [
    "Programming Language :: Python :: 3",
]

dynamic = ["version"]

requires-python = ">=3.8,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "sympy",
    "trimesh",
    "spglib",
    "seekpath",
    "ase",
    "PyYAML",
    "gdown",
    "dill",
    "variconfig",
    "huggingface_hub",
    "pyvista[jupyter]>0.44.0",
    "vtk"
]

[project.optional-dependencies]

tests = ["pytest","pytest-cov","pymatgen","PyGithub", ]
build = ["setuptools-scm","setuptools","build",]
format = ["ruff"]
lint = ["pylint"]

docs = [
    "sphinx_design",
    "sphinx-copybutton",
    "sphinx-gallery",
    "numpydoc",
    "pypandoc",
    "pydata-sphinx-theme",
    "sphinxcontrib-yaml",
    "sphinxcontrib-autoyaml",
    "python-dotenv",
    "ipython",
    "imageio-ffmpeg",
    "sphinx", 
    "sphinx_rtd_theme",
    "myst_parser",
    "nbsphinx",
    "sphinx-new-tab-link",
    "sphinxcontrib-youtube",
    "sphinxcontrib-video",
    "pandoc",
    "furo"
]

# Combine docs and tests, plus add any dev-specific packages
dev = [
    "pyprocar[docs,tests,format,lint]"
]


[project.urls]
homepage = "https://github.com/romerogroup/pyprocar"
documentation = "https://romerogroup.github.io/pyprocar/"
Issues = "https://github.com/romerogroup/pyprocar/issues"
Changelog = "https://github.com/romerogroup/pyprocar/CHANGELOG.md"

[project.scripts]
pyprocar-download = "scripts.download:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["pyprocar*", "scripts*"]
exclude = ["pyprocar.tests*"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]



[tool.pixi]
pypi-dependencies = {pyprocar = {path = ".", editable = true}}

[tool.pixi.feature]
# core = {pypi-dependencies = {pyprocar = {path = ".", editable = true}}}
py310 = {dependencies = {python = "3.10.*"}}
py311 = {dependencies = {python = "3.11.*"}}
py312 = {dependencies = {python = "3.12.*"}}
py313 = {dependencies = {python = "3.13.*"}}



[tool.pixi.environments]
py310 = { features = ["py310", "tests"] }
py311 = { features = ["py311", "tests"] }
py312 = { features = ["py312", "tests"] }
py313 = { features = ["py313", "tests"] }
tests = { features = ["tests"] }
lint = { features = ["lint"] }
format = { features = ["format"] }
build = { features = ["build"] }
docs = { features = ["docs"] }
dev = { features = ["dev"] }



[tool.pixi.tasks]
_format = "ruff"
_lint = "pylint"
_test = "pytest"

format = { depends-on = [{task = "_format", environment = "py312"}] }
lint = { depends-on = [{task = "_lint", environment = "py312"}] }
test = { depends-on = [{task = "_test", environment = "py312"}] }
style = [{ task = "fmt" }, { task = "lint" }]

[tool.pixi.tasks.test-all]
depends-on = [
  { task = "_test", environment = "py310"},
  { task = "_test", environment = "py311"},
  { task = "_test", environment = "py312"},
  { task = "_test", environment = "py313"},

]
