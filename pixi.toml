###############################################################
# Workspace Definition
###############################################################
[workspace]
# AUTHORS_LIST
channels = [
  "https://prefix.dev/conda-forge",
  "https://conda.anaconda.org/conda-forge",
]
description = "PyProcar is a robust, open-source Python library used for pre- and post-processing of the electronic structure data coming from DFT calculations. "
name = "pyprocar"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]
preview = ["pixi-build"]

version = "6.5.0"

###############################################################
# Package Definition
###############################################################

[package]
name = { workspace = true }
version = { workspace = true }

[package.build]
backend = { name = "pixi-build-python", version = "*" }

# These are dependencies needed for the build process
[package.host-dependencies]
editables = "*"
hatch-vcs = "*"
hatchling = "*"
platformdirs = "*"
python = ">=3.8"

# These are dependencies need for your package to run
[package.run-dependencies]
python = ">=3.8"
python-dotenv = "*"
matplotlib = ">=3.8"
numpy = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"
scipy = "*"
sympy = "*"
trimesh = "*"
spglib = "*"
seekpath = "*"
ase = "*"
PyYAML = "*"
gdown = "*"
dill = "*"
variconfig = "*"
huggingface_hub = "*"
pyvista = ">0.44.0"
vtk = "*"
lxml="*"

[feature.pyprocar.dependencies]
pyprocar = { path = "." }


###############################################################
# Default workspace Feature Set Dependencies
###############################################################
# Default dependencies
[dependencies]
git = ">=2.51.0,<3"
python = ">=3.8,<3.14"

[tasks]
bump = "tbump --only-patch $RELEASE_VERSION --config $PIXI_PROJECT_ROOT/.config/tbump.toml"

build-release = "hatch build --hooks-only"
init = "python scripts/init-template.py"
release = "python scripts/release.py"

test = { depends-on = ["test-all"], description = "Run all tests" }
###############################################################
# Additional workspace Feature Set Definitions
###############################################################
# Docs feature set dependencies
[feature.docs.dependencies]
furo = "*"
git-cliff = ">=2.10.0,<3"
imageio-ffmpeg = "*"
ipython = "*"
myst-parser = "*"
nbsphinx = "*"
numpydoc = "*"
pandoc = "*"
sphinx = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-video = "*"
sphinxcontrib-youtube = "*"
# Docs feature set PyPI dependencies
[feature.docs.pypi-dependencies]
sphinx-new-tab-link = "*"

[feature.docs.tasks]
bump-changelog = { cmd = "git-cliff --unreleased --prepend CHANGELOG.md --tag $RELEASE_VERSION --config $PIXI_PROJECT_ROOT/.config/cliff.toml", env = { GITHUB_TOKEN = "$GITHUB_TOKEN" } }
git-cliff-init = "git-cliff --init --config $PIXI_PROJECT_ROOT/.config/cliff.toml"

[feature.dev.dependencies]
pandas-stubs = "*"
tbump = ">=6.9.0,<7"

[feature.pytest.dependencies]
dirty-equals = ">=0.10.0,<0.11"
filelock = ">=3.19.1,<4"
inline-snapshot = ">=0.29.3,<0.30"
py-rattler = ">=0.16.0,<0.17"
pytest = ">=8.4.2,<9"
pytest-rerunfailures = ">=16.0.1,<17"
pytest-timeout = ">=2.4.0,<3"
pytest-xdist = ">=3.8.0,<4"
pyyaml = ">=6.0.3,<7"
rattler-build = ">=0.47.1,<0.48"
rich = "*"
tomli-w = ">=1.2.0,<2"
types-pyyaml = ">=6.0.12.20250915,<7"

[feature.pytest.tasks]
test-all = { cmd = "pytest -s --numprocesses=auto tests --config-file $PIXI_PROJECT_ROOT/.config/.pytest.toml" }
test-specific = { cmd = "pytest -k '{{ test_substring }}' --config-file $PIXI_PROJECT_ROOT/.config/.pytest.toml", args = [
  "test_substring",
] }

[feature.llm.dependencies]
openai = "*"
pygithub = "*"
python-dotenv = "*"

[feature.llm.tasks]
summarize-pr = { cmd = "python scripts/summarize_pr_commits.py" }

[feature.lint.dependencies]
actionlint = ">=1.7.7,<2"
basedpyright = ">=1.31.6,<2"
dprint = ">=0.49.1,<0.51"
go-shfmt = ">=3.12.0,<4"
lefthook = ">=1.13.6,<2"
ruff = ">=0.14.0,<0.15"
shellcheck = ">=0.10.0,<0.11"
taplo = ">=0.10.0,<0.11"
typos = ">=1.38.1,<2"

[feature.lint.tasks]
actionlint = { cmd = "actionlint", env = { SHELLCHECK_OPTS = "-e SC2086" } }
dprint-check = { cmd = "dprint check --allow-no-files --config $PIXI_PROJECT_ROOT/.config/.dprint.jsonc", description = "Check formatting with dprint" }
dprint-fmt = { cmd = "dprint fmt --allow-no-files --incremental=false --config $PIXI_PROJECT_ROOT/.config/.dprint.jsonc", description = "Format with dprint" }
lefthook = { cmd = "lefthook", description = "Run lefthook" }
lefthook-reinstall = { cmd = "lefthook uninstall && lefthook install", description = "Reinstall lefthook" }
lint = { depends-on = [
  "lint-fast",
  "lint-slow",
], description = "Run all linters and formatters on all code" }
lint-fast = { cmd = "lefthook run pre-commit --all-files --force", description = "Run all fast linters and formatters on all code (no clippy)" }
lint-slow = { cmd = "lefthook run pre-push --all-files --force", description = "Run all slow linters and formatters on all code" }
pre-commit-install = "lefthook install"
pre-commit-install-minimal = "lefthook install pre-commit"
ruff-format = { cmd = "ruff format --exit-non-zero-on-format --force-exclude --config $PIXI_PROJECT_ROOT/.config/.ruff.toml" }
ruff-lint = { cmd = "ruff check --fix --exit-non-zero-on-fix --force-exclude --config $PIXI_PROJECT_ROOT/.config/.ruff.toml" }
toml-format = { cmd = "taplo fmt", env = { RUST_LOG = "warn" } }
toml-lint = "taplo lint --verbose **/pixi.toml --config $PIXI_PROJECT_ROOT/.config/.taplo.toml"
typecheck-python = "basedpyright --project pyrightconfig.json"
typos = "typos --force-exclude --config $PIXI_PROJECT_ROOT/.config/.typos.toml"

[feature.rust.dependencies]
rust = ">=1.88.0,<1.89"

[feature.build.dependencies]
# Needed for building
compilers = ">=1.11.0,<2"
git = ">=2.51.0,<3"
hatch = "*"
hatch-vcs = "*"
hatchling = "*"
openssl = ">=3.5.4,<4"
pkg-config = ">=0.29.2,<0.30"
python-build = "*"
rust-src = ">=1.88.0,<2"

[feature.build.target.linux-64.dependencies]
clang = ">=21.1.2,<22"
compilers = ">=1.6.0"
make = ">=4.4.1,<5"
mold = ">=2.40.2,<3"

[feature.build.target.win-64.dependencies]
vs2017_win-64 = ">=19.16.27033,<20"

[feature.build.tasks]
get-version = "hatch version"



###############################################################
# Virtual Environments Definitions
###############################################################
[environments]
default = { features = ["build", "dev", "pytest"], solve-group = "default" }

docs = { features = [
  "docs",
], no-default-feature = true, solve-group = "default" }
lint = { features = [
  "lint",
  "rust",
  "pytest",
  "build",
  "dev",
  "llm",
], no-default-feature = true, solve-group = "default" }
llm = { features = ["llm"], no-default-feature = true, solve-group = "default" }

dev = { features = [
  "lint",
  "rust",
  "pytest",
  "build",
  "dev",
  "llm",
  "pyprocar"
], no-default-feature = true, solve-group = "default" } 