###############################################################
# Workspace Definition
###############################################################
[workspace]
# AUTHORS_LIST
channels = [
  "https://prefix.dev/conda-forge",
  "https://conda.anaconda.org/conda-forge",
]
description = "PyProcar is a robust, open-source Python library used for pre- and post-processing of the electronic structure data coming from DFT calculations. "
name = "pyprocar"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]
preview = ["pixi-build"]

version = "6.5.0"

[dependencies]
git = ">=2.51.0,<3"
python = ">=3.10,<3.14"

[tasks]
bump = "tbump --only-patch $RELEASE_VERSION --config $PIXI_PROJECT_ROOT/.config/tbump.toml"

build-release = "hatch build --hooks-only"
init = "python scripts/init-template.py"
release = "python scripts/release.py"
###############################################################
# Package Definition
###############################################################

[package]
name = { workspace = true }
version = { workspace = true }

[package.build]
backend = { name = "pixi-build-python", version = "*" }

# These are dependencies needed for the build process
[package.host-dependencies]
editables = "*"
hatch-vcs = "*"
hatchling = "*"
platformdirs = "*"
python = "*"

# These are dependencies need for your package to run
[package.run-dependencies]
python = "*"
python-dotenv = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"
scipy = "*"
sympy = "*"
trimesh = "*"
spglib = "*"
seekpath = "*"
ase = "*"
PyYAML = "*"
gdown = "*"
dill = "*"
variconfig = "*"
huggingface_hub = "*"
pyvista = ">0.44.0"
vtk = "*"
lxml = "*"


###############################################################
# PyProcar feature set dependencies
###############################################################

[feature.pyprocar.dependencies]
pyprocar = { path = "." }


###############################################################
# Docs feature set dependencies
###############################################################

[feature.docs.dependencies]
furo = "*"
git-cliff = ">=2.10.0,<3"
imageio-ffmpeg = "*"
ipython = "*"
myst-parser = "*"
nbsphinx = "*"
numpydoc = "*"
pandoc = "*"
sphinx = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx_rtd_theme = "*"
sphinxcontrib-video = "*"
sphinxcontrib-youtube = "*"
# Docs feature set PyPI dependencies
[feature.docs.pypi-dependencies]
sphinx-new-tab-link = "*"

[feature.docs.tasks]
bump-changelog = { cmd = "git-cliff --unreleased --prepend CHANGELOG.md --tag $RELEASE_VERSION --config $PIXI_PROJECT_ROOT/.config/cliff.toml", env = { GITHUB_TOKEN = "$GITHUB_TOKEN" } }
git-cliff-init = "git-cliff --init --config $PIXI_PROJECT_ROOT/.config/cliff.toml"


###############################################################
# Pytest feature set dependencies
###############################################################


[feature.pytest.dependencies]
dirty-equals = "*"
filelock = "*"
inline-snapshot = "*"
py-rattler = "*"
pytest = "*"
pytest-rerunfailures = "*"
pytest-timeout = "*"
pytest-xdist = "*"
pyyaml = "*"
rattler-build = "*"
rich = "*"
tomli-w = "*"
types-pyyaml = "*"

[feature.pytest.tasks]

test = { cmd = "bash $PIXI_PROJECT_ROOT/.config/run_silent_pytest.sh {{ test_pattern }} {{ verbose }}", args = [{ arg = "test_pattern", default = "" }, { arg = "verbose", default = "" }], description = "Run tests (optional: test_pattern, --verbose|-v)" }


###############################################################
# Lint feature set dependencies
###############################################################

[feature.lint.dependencies]
actionlint = "*"
basedpyright = "*"
dprint = "*"
go-shfmt = "*"
ruff = "*"
shellcheck = "*"
taplo = "*"
typos = "*"

[feature.lint.tasks]
actionlint = { cmd = "actionlint", env = { SHELLCHECK_OPTS = "-e SC2086" } }
dprint-check = { cmd = "dprint check --allow-no-files --config $PIXI_PROJECT_ROOT/.config/.dprint.jsonc", description = "Check formatting with dprint" }
dprint-fmt = { cmd = "dprint fmt --allow-no-files --incremental=false --config $PIXI_PROJECT_ROOT/.config/.dprint.jsonc", description = "Format with dprint" }
toml-format = { cmd = "taplo fmt", env = { RUST_LOG = "warn" } }
toml-lint = "taplo lint --verbose **/pixi.toml --config $PIXI_PROJECT_ROOT/.config/.taplo.toml"

typos = "typos --force-exclude --config $PIXI_PROJECT_ROOT/.config/.typos.toml"

typecheck = { cmd = "bash $PIXI_PROJECT_ROOT/.config/run_silent_typecheck.sh {{ file_path }} {{ verbose }}", args = [{ arg = "file_path", default = "" }, { arg = "verbose", default = "" }], description = "Run type checking (optional: file_path, --verbose|-v)" }

ruff-lint = { cmd = "bash $PIXI_PROJECT_ROOT/.config/run_silent_ruff_lint.sh {{ file_path }} {{ verbose }} {{ scope }}", args = [{ arg = "file_path", default = "" }, { arg = "verbose", default = "" }, { arg = "scope", default = "" }], description = "Run ruff linting (optional: file_path, --verbose|-v, --src|--tests)" }
ruff-format = { cmd = "bash $PIXI_PROJECT_ROOT/.config/run_silent_ruff_format.sh {{ file_path }} {{ verbose }} {{ scope }}", args = [{ arg = "file_path", default = "" }, { arg = "verbose", default = "" }, { arg = "scope", default = "" }], description = "Run ruff formatting (optional: file_path, --verbose|-v, --src|--tests)" }



[feature.lint.tasks.lint-src]
depends-on = [
  { task = "ruff-lint", args = ["--src"] },
  { task = "ruff-format", args = ["--src"] }
]
description = "Run linting and formatting on src/**/*.py code"

[feature.lint.tasks.lint-tests]
depends-on = [
  { task = "ruff-lint", args = ["--tests"] },
  { task = "ruff-format", args = ["--tests"] }
]
description = "Run linting and formatting on tests/**/*.py code"

[feature.lint.tasks.lint]
depends-on = ["lint-src", "lint-tests"]
description = "Run all linters and formatters on all code"


###############################################################
# Dev feature set dependencies
###############################################################

[feature.dev.dependencies]
tbump = "*"
pandas-stubs = "*"
scipy-stubs = "*"
ipykernel = "*"

[feature.dev.pypi-dependencies]
matplotlib-stubs = "*"

[feature.dev.tasks]
check = "pixi run -q -e dev typecheck && pixi run -q -e dev test && pixi run -q -e dev lint"
ci-check = "pixi run -q -e ci typecheck && pixi run -q -e ci test && pixi run -q -e ci lint"



###############################################################
# Virtual Environments Definitions
###############################################################
[environments]
default = { features = ["pyprocar"], solve-group = "default" }
docs = { features = ["pyprocar", "docs"], no-default-feature = true, solve-group = "default" }
lint = { features = ["pyprocar", "lint"], no-default-feature = true, solve-group = "default" }
dev = { features = ["pyprocar", "lint", "pytest", "dev" ], no-default-feature = true, solve-group = "default" }
