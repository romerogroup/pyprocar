name: CI

on:
  pull_request:
  push:
    branches: [main, dev, dos-rewrite]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Lint and format judge only what this PR (or push) changed.
  # A pull_request checkout is the merge commit, so HEAD^1 is the base it merged into.
  BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}

jobs:
  lint:
    # One-time exemption: merging dos-rewrite into dev (#237) adds ~245 files the gate would treat as all-new.
    # Pinned to dev's pre-merge tip, so it expires as soon as dev moves.
    if: ${{ !(github.event.pull_request.base.sha == 'f0d6b514e0b72758afc5379b79b87e673113eb06' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.event.before == 'f0d6b514e0b72758afc5379b79b87e673113eb06')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: lint
          locked: true
      - name: ruff check (fails on new violations in changed files)
        run: pixi run --locked -e lint python .github/scripts/ruff_new_violations.py check "$BASE"

  format:
    # One-time exemption: merging dos-rewrite into dev (#237) adds ~245 files the gate would treat as all-new.
    # Pinned to dev's pre-merge tip, so it expires as soon as dev moves.
    if: ${{ !(github.event.pull_request.base.sha == 'f0d6b514e0b72758afc5379b79b87e673113eb06' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.event.before == 'f0d6b514e0b72758afc5379b79b87e673113eb06')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: lint
          locked: true
      - name: ruff format --check (changed files that were formatted must stay formatted)
        run: pixi run --locked -e lint python .github/scripts/ruff_new_violations.py format "$BASE"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: dev
          locked: true
          # A cached env skips the editable build that writes pyprocar/_version.py.
          cache: false
      - name: basedpyright (fails on errors not in .basedpyright/baseline.json)
        run: pixi run --locked -e dev basedpyright --project pyrightconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: dev
          locked: true
          # A cached env skips the editable build that writes pyprocar/_version.py.
          cache: false
      - name: pytest (quick set, tests marked data need DFT fixtures)
        run: pixi run --locked -e dev pytest tests -c .config/.pytest.toml --rootdir . -n auto -m "not data"
